<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#263d41">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:#263d41; }
    body { position:fixed; inset:0; color:#e5e3ce; font-family:system-ui,-apple-system,sans-serif; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    #stage { position:fixed; top:env(safe-area-inset-top,0px); right:env(safe-area-inset-right,0px); bottom:env(safe-area-inset-bottom,0px); left:env(safe-area-inset-left,0px); }
    #canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; }
    #welcome { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; background:radial-gradient(ellipse at 50% 100%,#375954 0%,#263d41 72%); }
    .eyebrow { color:#a7c0b6; font-size:10px; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:12px 0 5px; font-size:clamp(32px,6vw,62px); font-weight:650; letter-spacing:-.055em; }
    .dot { color:#ee876e; }
    #status { max-width:480px; min-height:20px; margin:10px 0 18px; font-size:13px; color:#c1cfc0; line-height:1.5; }
    #start { border:0; border-radius:4px; background:#ee876e; color:#263d41; padding:14px 26px; font:600 14px system-ui; min-height:48px; cursor:pointer; touch-action:manipulation; }
    #start:focus-visible { outline:2px solid #e5e3ce; outline-offset:5px; }
    #start:disabled { opacity:.55; }
    progress { width:220px; height:4px; accent-color:#ee876e; margin-top:18px; }
    .footnote { position:absolute; bottom:18px; font-size:10px; color:#9db4aa; letter-spacing:.06em; }
    #rotate { display:none; position:absolute; left:18px; right:18px; bottom:24px; background:rgba(38,61,65,.95); padding:16px; text-align:center; border:1px solid #627f76; border-radius:6px; font-size:13px; pointer-events:none; }
    [hidden] { display:none !important; }
    @media (orientation:portrait) { #rotate { display:block; } .footnote { bottom:110px; } }
  </style>
</head>
<body data-state="ready">
  <main id="stage">
    <canvas id="canvas" tabindex="0" aria-label="Porto Lume: jogo de exploração urbana"></canvas>
    <div id="welcome">
      <span class="eyebrow">BAIRRO AURORA · PROTÓTIPO 05</span>
      <h1>Porto Lume<span class="dot">.</span></h1>
      <p id="status" role="status">A cidade reage às suas escolhas.<br>Explore a pé ou dirija, observe as estrelas e tente despistar a polícia.</p>
      <button id="start" type="button">Iniciar exploração</button>
      <progress id="progress" max="100" value="0" hidden></progress>
      <span class="footnote">2D TOP-DOWN · LANDSCAPE · TOUCH</span>
    </div>
    <div id="rotate" role="status">Gire o celular para jogar em landscape.<br>Desative o bloqueio de rotação, se necessário.</div>
  </main>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const engine = new Engine(GODOT_CONFIG);
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const start = document.getElementById('start');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');

    // Policy 0: o shell controla o canvas para respeitar as safe areas do iPhone.
    // Limitar DPR reduz custo de preenchimento em telas móveis de alta densidade.
    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      const width = Math.max(1, Math.round(stage.clientWidth * ratio));
      const height = Math.max(1, Math.round(stage.clientHeight * ratio));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
    }
    resizeCanvas();
    new ResizeObserver(resizeCanvas).observe(stage);
    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('gesturestart', event => event.preventDefault(), {passive:false});
    canvas.addEventListener('contextmenu', event => event.preventDefault());

    start.addEventListener('click', async () => {
      start.disabled = true;
      document.body.dataset.state = 'loading';
      status.textContent = 'Carregando o bairro…';
      progress.hidden = false;
      try {
        if (typeof Engine.getMissingFeatures === 'function') {
          const missing = Engine.getMissingFeatures({threads:false});
          if (missing.length) throw new Error('Recursos indisponíveis: ' + missing.join(', '));
        }
        resizeCanvas();
        await engine.startGame({
          canvas, canvasResizePolicy:0, focusCanvas:true,
          onProgress: (current, total) => {
            if (total > 0) {
              progress.value = Math.round(current / total * 100);
              status.textContent = 'Carregando o bairro… ' + progress.value + '%';
            }
          },
        });
        resizeCanvas();
        document.getElementById('welcome').hidden = true;
        document.body.dataset.state = 'running';
        canvas.focus();
      } catch (error) {
        document.body.dataset.state = 'error';
        status.textContent = 'Não foi possível iniciar. ' + (error.message || error) + ' Atualize o Safari e tente novamente.';
        progress.hidden = true;
        start.disabled = false;
        start.textContent = 'Tentar novamente';
        console.error(error);
      }
    });
  </script>
</body>
</html>
